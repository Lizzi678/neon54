<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления сайтом NEON54</title>
    <style>
        body { background: #0b0b0e; color: #fff; font-family: 'Segoe UI', Roboto, sans-serif; padding: 30px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #00f3ff; text-shadow: 0 0 15px rgba(0, 243, 255, 0.4); margin-bottom: 30px; font-size: 2rem; }
        .card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); padding: 25px; border-radius: 16px; margin-bottom: 25px; backdrop-filter: blur(10px); }
        h2 { margin-top: 0; color: #ff007f; font-size: 1.4rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        label { display: block; margin: 15px 0 5px; color: #ccc; font-size: 0.9rem; }
        input[type="text"], input[type="number"], input[type="password"], textarea, select { width: 100%; padding: 12px; background: #141419; border: 1px solid #2d2d37; border-radius: 8px; color: #fff; box-sizing: border-box; font-size: 14px; }
        input:focus, textarea:focus, select:focus { border-color: #00f3ff; outline: none; }
        button { background: linear-gradient(90deg, #ff007f, #ff0055); color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s; width: 100%; font-size: 15px; }
        button:hover { opacity: 0.9; box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); }
        .btn-portfolio { background: linear-gradient(90deg, #00f3ff, #00bfff); color: #000; }
        .btn-portfolio:hover { box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); }
        .token-box { background: rgba(0, 243, 255, 0.05); border: 1px dashed #00f3ff; padding: 15px; border-radius: 8px; margin-bottom: 25px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Панель управления NEON54</h1>

    <div class="token-box">
        <label for="github-token">GitHub Token:</label>
        <input type="password" id="github-token" placeholder="Ваш токен">
    </div>

    <div class="card">
        <h2>Добавить работу в портфолио</h2>
        <form id="portfolio-form">
            <label for="p-title">Название вывески</label>
            <input type="text" id="p-title" placeholder="Например: Неоновый логотип Coffee" required>

            <label for="p-category">Категория</label>
            <select id="p-category">
                <option value="Для бизнеса">Для бизнеса</option>
                <option value="Для дома">Для дома</option>
            </select>

            <label for="p-price">Стоимость работы (в рублях)</label>
            <input type="number" id="p-price" placeholder="Например: 12500" required min="0">

            <label for="p-image">Изображение вывески</label>
            <input type="file" id="p-image" accept="image/*" required style="margin-top:5px; color:#aaa;">

            <button type="submit" class="btn-portfolio">Опубликовать в портфолио</button>
        </form>
    </div>

    <div class="card">
        <h2>Добавить новость</h2>
        <form id="news-form">
            <label for="n-title">Заголовок новости</label>
            <input type="text" id="n-title" placeholder="Заголовок" required>

            <label for="n-text">Текст новости</label>
            <textarea id="n-text" rows="5" placeholder="Введите текст новости..." required></textarea>

            <label for="n-image">Картинка (необязательно)</label>
            <input type="file" id="n-image" accept="image/*" style="margin-top:5px; color:#aaa;">

            <button type="submit">Опубликовать новость</button>
        </form>
    </div>
</div>

<script>
    const tokenInput = document.getElementById('github-token');
    tokenInput.value = localStorage.getItem('github_token') || "";
    tokenInput.addEventListener('input', () => {
        localStorage.setItem('github_token', tokenInput.value.trim());
    });
    if (!localStorage.getItem('github_token')) {
        localStorage.setItem('github_token', tokenInput.value);
    }

    const REPO = 'lizzi678/neon54';
    const BRANCH = 'main';
    const FILE_PATH = 'data.json';

    async function processImage(file, maxWidth = 800) {
        return new Promise((resolve) => {
            if (!file) resolve('');
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
            };
        });
    }

    async function loadDataFromGitHub() {
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}?ref=${BRANCH}`);
            if (!res.ok) return { news: [], portfolio: [] };
            const data = await res.json();
            const jsonString = decodeURIComponent(escape(atob(data.content)));
            return JSON.parse(jsonString);
        } catch (e) {
            return { news: [], portfolio: [] };
        }
    }

    async function saveDataToGitHub(newData, message) {
        const token = tokenInput.value.trim();
        if (!token) {
            alert('Пожалуйста, введите токен!');
            return false;
        }

        try {
            const getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}?ref=${BRANCH}`, {
                headers: { 'Authorization': `token ${token}` }
            });
            
            let sha = '';
            if (getRes.ok) {
                const fileData = await getRes.json();
                sha = fileData.sha;
            }

            const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(newData, null, 2))));

            const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: message,
                    content: contentEncoded,
                    branch: BRANCH,
                    sha: sha ? sha : undefined
                })
            });

            if (putRes.ok) {
                return true;
            } else {
                const err = await putRes.json();
                alert('Ошибка GitHub: ' + (err.message || 'Не удалось сохранить'));
                return false;
            }
        } catch (e) {
            alert('Ошибка сети: ' + e.message);
            return false;
        }
    }

    document.getElementById('portfolio-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const imageFile = document.getElementById('p-image').files[0];
        const base64Image = await processImage(imageFile);
        
        let db = await loadDataFromGitHub();
        db.portfolio = db.portfolio || [];
        db.portfolio.push({
            id: Date.now(),
            title: document.getElementById('p-title').value.trim(),
            category: document.getElementById('p-category').value,
            price: document.getElementById('p-price').value,
            image: base64Image
        });
        
        const success = await saveDataToGitHub(db, 'Добавлена работа в портфолио');
        if (success) {
            alert("Работа успешно опубликована!");
            this.reset();
        }
    });

    document.getElementById('news-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const imageFile = document.getElementById('n-image').files[0];
        const base64Image = imageFile ? await processImage(imageFile) : '';
        
        let db = await loadDataFromGitHub();
        db.news = db.news || [];
        db.news.push({
            id: Date.now(),
            title: document.getElementById('n-title').value.trim(),
            date: new Date().toLocaleDateString('ru-RU'),
            text: document.getElementById('n-text').value.trim(),
            image: base64Image
        });
        
        const success = await saveDataToGitHub(db, 'Добавлена новость');
        if (success) {
            alert("Новость успешно опубликована!");
            this.reset();
        }
    });
</script>
</body>
</html>
